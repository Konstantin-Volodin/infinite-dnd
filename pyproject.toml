[project]
name = "infinite-dnd"
version = "0.0.1"
description = "AI-driven D&D game with autonomous agents"
authors = [{ name = "Konstantin Volodin" }]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["dnd", "ai", "game", "llm", "agents"]

dependencies = [
    "jinja2>=3.1.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
]

[project.scripts]
infinite-dnd = "run_game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]