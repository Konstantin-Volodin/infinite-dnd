<!DOCTYPE html>
<html>
<head>
    <title>📖 Story Log</title>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #eaeaea;
            --text-dim: #a0a0a0;
            --accent: #e94560;
            --accent2: #0f3460;
            --gold: #f4d03f;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.8;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: var(--gold);
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 40px;
        }
        
        .scene-header {
            background: linear-gradient(135deg, var(--accent2), var(--card-bg));
            padding: 20px 30px;
            margin: 40px -20px;
            border-left: 4px solid var(--accent);
        }
        
        .scene-header h2 {
            margin: 0;
            color: var(--gold);
            font-size: 1.5em;
        }
        
        .event {
            margin: 20px 0;
            padding: 15px 20px;
            border-radius: 8px;
        }
        
        .dialogue {
            background: var(--card-bg);
            border-left: 3px solid var(--accent);
        }
        
        .dialogue .speaker {
            color: var(--accent);
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .dialogue .message {
            font-size: 1.1em;
            margin-top: 8px;
            font-style: italic;
        }
        
        .dialogue .message::before { content: '"'; color: var(--gold); }
        .dialogue .message::after { content: '"'; color: var(--gold); }
        
        .narration {
            background: transparent;
            color: var(--text-dim);
            font-style: italic;
            padding: 10px 30px;
            border-left: 2px solid var(--accent2);
        }
        
        .action {
            background: var(--accent2);
            border-left: 3px solid var(--gold);
        }
        
        .action .actor {
            color: var(--gold);
            font-weight: bold;
        }
        
        .thought {
            background: rgba(244, 208, 63, 0.1);
            border: 1px dashed var(--gold);
            font-size: 0.95em;
        }
        
        .thought-label {
            color: var(--gold);
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .thought-content {
            color: var(--text-dim);
            font-style: italic;
        }
        
        .world-change {
            text-align: center;
            color: var(--gold);
            padding: 20px;
            font-style: italic;
        }
        
        .world-change::before { content: '✨ '; }
        .world-change::after { content: ' ✨'; }
        
        .movement {
            text-align: center;
            color: var(--text-dim);
            font-style: italic;
            padding: 10px;
        }
        
        .timestamp {
            font-size: 0.7em;
            color: var(--text-dim);
            float: right;
            opacity: 0.5;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9em;
        }
        
        .controls label {
            cursor: pointer;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="controls">
        <label>
            <input type="checkbox" id="showThoughts" checked onchange="toggleThoughts()">
            Show character thoughts
        </label>
    </div>
    
    <div class="container">
        <h1>📖 Story Log</h1>
        <p class="subtitle">Generated: 2026-01-28 16:07</p>
        
        <div class="story">

        </div>
    </div>
    
    <script>
        function toggleThoughts() {
            const show = document.getElementById('showThoughts').checked;
            document.querySelectorAll('[data-thought]').forEach(el => {
                el.classList.toggle('hidden', !show);
            });
        }
    </script>
</body>
</html>
